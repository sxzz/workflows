name: Sync Branches

on:
  push:
    branches: [main]

concurrency:
  group: sync-branches
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true

      - name: Force push main to v1 and v2
        run: |
          git push origin HEAD:refs/heads/v1 --force
          git push origin HEAD:refs/heads/v2 --force
