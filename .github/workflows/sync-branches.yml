name: Sync Branches

on:
  push:
    branches: [main]

concurrency:
  group: sync-branches
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: true

      - name: Force push main to v1 and v2
        run: |
          git push origin HEAD:refs/heads/v1 --force
          git push origin HEAD:refs/heads/v2 --force
