name: Sync Branches

on:
  push:
    branches: [main]

concurrency:
  group: sync-branches
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Force push main to v1 and v2
        run: |
          git push origin HEAD:refs/heads/v1 --force
          git push origin HEAD:refs/heads/v2 --force
