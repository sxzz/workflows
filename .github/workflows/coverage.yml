name: Coverage

on:
  workflow_call:
    inputs:
      test:
        required: false
        type: string
        default: vp test run --coverage

      build:
        required: false
        type: string
        default: vp run build

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Setup Vite Plus
        uses: sxzz/workflows/setup-vp@main

      - name: Build
        run: ${{ inputs.build }}

      - name: Coverage
        run: ${{ inputs.test }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
