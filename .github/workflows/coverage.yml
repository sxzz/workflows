name: Coverage

on:
  workflow_call:
    inputs:
      test:
        required: false
        type: string
        default: vp test run --coverage

      build:
        required: false
        type: string
        default: vp run build

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Setup Vite Plus
        uses: sxzz/workflows/setup-vp@main

      - name: Build
        run: ${{ inputs.build }}

      - name: Coverage
        run: ${{ inputs.test }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
